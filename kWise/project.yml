name: kWise
options:
  bundleIdPrefix: app.kraftly
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  kWise:
    type: application
    platform: macOS
    productName: Klaris
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "**/*.md"
          - "Tests/**"
          - "UITests/**"
          - "scripts/**"
          - "Widgets/**"          # separate widget appex target
          - "FinderExtension/**"  # separate Finder Sync appex target
          - "Configuration/**"    # .storekit is dev-only — in project, not bundled (fix r1)
      - path: Configuration
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Klaris
        PRODUCT_MODULE_NAME: kWise
        ENTITLEMENTS_FILE: kWise.entitlements
    dependencies:
      - package: kFoundation
        product: DetectionCore
      - package: kFoundation
        product: AppCatalogCore
      - package: kFoundation
        product: PowerScope
      - package: kFoundation
        product: CommonUtils
      - package: kFoundation
        product: FileScanner
      - package: kFoundation
        product: DesignSystem
    preBuildScripts:
      - name: "SwiftLint"
        script: "if which swiftlint >/dev/null; then swiftlint; fi"
        basedOnDependencyAnalysis: false

  kWiseWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Widgets
      - Shared            # WidgetSnapshot feed + RunSmartCareIntent (dual-target)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris.widget
        PRODUCT_NAME: kWiseWidget
        INFOPLIST_FILE: Widgets/Info.plist
        ENTITLEMENTS_FILE: kWiseWidget.entitlements
    dependencies:
      - package: kFoundation
        product: DetectionCore
      - package: kFoundation
        product: AppCatalogCore
      - package: kFoundation
        product: PowerScope
      - package: kFoundation
        product: CommonUtils
      - package: kFoundation
        product: FileScanner
      - package: kFoundation
        product: DesignSystem

  kWiseFinder:
    type: app-extension
    platform: macOS
    sources:
      - FinderExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris.finder
        PRODUCT_NAME: kWiseFinder
        INFOPLIST_FILE: FinderExtension/Info.plist
        ENTITLEMENTS_FILE: kWiseFinder.entitlements
    dependencies:
      - package: kFoundation
        product: DetectionCore
      - package: kFoundation
        product: AppCatalogCore
      - package: kFoundation
        product: PowerScope
      - package: kFoundation
        product: CommonUtils
      - package: kFoundation
        product: FileScanner
      - package: kFoundation
        product: DesignSystem

  kWiseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: kWise
      - package: kFoundation

  kWiseUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: kWise

packages:
  kFoundation:
    path: ../kFoundation

schemes:
  kWise:
    build:
      targets:
        kWise: all
    run:
      config: Debug
      # P1 T7 — local purchase testing against the non-consumable buyout.
      storeKitConfiguration: Configuration/Klaris.storekit
    test:
      config: Debug
      targets:
        - kWiseTests   # UITests excluded from default test action until Phase 8
  kWiseWidget:
    build:
      targets:
        kWiseWidget: all
  kWiseFinder:
    build:
      targets:
        kWiseFinder: all
