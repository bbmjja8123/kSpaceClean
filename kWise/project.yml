name: kWise
options:
  bundleIdPrefix: app.kraftly
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      # 开发签名（修订 P3 R1 的 Debug ad-hoc 决策）：ad-hoc 每次重编译签名
      # 身份都变 → TCC 把每个 build 当新 app，授权全作废、权限弹窗风暴。
      # Manual + Apple Development：Automatic 会无视显式 identity、按平台找
      # "Mac Development"（本机钥匙串没有）。无 entitlements → 不需要
      # profile，CLI 构建不受影响。
      DEVELOPMENT_TEAM: "TC973L6HPC"
      CODE_SIGN_STYLE: Manual
      # 用 SHA-1 直接指定：Xcode 会把 "Apple Development" 名字按平台映射成
      # "Mac Development"（本机没有该名字证书）导致解析失败；哈希精确匹配。
      CODE_SIGN_IDENTITY: "4DDA81287291B008FCDE79F4F260353E02EEEC7E"
    Release:
      DEVELOPMENT_TEAM: "TC973L6HPC"

targets:
  kWise:
    type: application
    platform: macOS
    productName: Klaris
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "**/*.md"
          - "Tests/**"
          - "UITests/**"
          - "scripts/**"
          - "Widgets/**"          # separate widget appex target
          - "FinderExtension/**"  # separate Finder Sync appex target
          - "Configuration/**"    # .storekit is dev-only — in project, not bundled (fix r1)
      - path: Configuration
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Klaris
        PRODUCT_MODULE_NAME: kWise
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DISTRIBUTION_MAS"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: kWise.entitlements
    dependencies:
      - package: kFoundation
        product: DetectionCore
      - package: kFoundation
        product: AppCatalogCore
      - package: kFoundation
        product: PowerScope
      - package: kFoundation
        product: CommonUtils
      - package: kFoundation
        product: FileScanner
      - package: kFoundation
        product: DesignSystem
    preBuildScripts:
      - name: "SwiftLint"
        script: "if which swiftlint >/dev/null; then swiftlint; fi"
        basedOnDependencyAnalysis: false

  # Direct (Developer ID) channel - same source tree, non-sandboxed so the
  # real home directory (Full Disk Access) is scannable. Shares bundle ID,
  # Info.plist and deep-link scheme with the MAS target (product decision:
  # one product, two distribution channels, not co-installable).
  KlarisDirect:
    type: application
    platform: macOS
    productName: Klaris
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "**/*.md"
          - "Tests/**"
          - "UITests/**"
          - "scripts/**"
          - "Widgets/**"          # separate widget appex target
          - "FinderExtension/**"  # separate Finder Sync appex target
          - "Configuration/**"    # .storekit is dev-only - in project, not bundled
      - path: Configuration
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Klaris
        PRODUCT_MODULE_NAME: kWise
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DISTRIBUTION_DIRECT"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          PRODUCT_NAME: KlarisDirect
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: kWiseDirect.entitlements
    dependencies:
      - package: kFoundation
        product: DetectionCore
      - package: kFoundation
        product: AppCatalogCore
      - package: kFoundation
        product: PowerScope
      - package: kFoundation
        product: CommonUtils
      - package: kFoundation
        product: FileScanner
      - package: kFoundation
        product: DesignSystem
    preBuildScripts:
      - name: "SwiftLint"
        script: "if which swiftlint >/dev/null; then swiftlint; fi"
        basedOnDependencyAnalysis: false

  kWiseWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Widgets
      - Shared            # WidgetSnapshot feed + RunSmartCareIntent (dual-target)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris.widget
        PRODUCT_NAME: kWiseWidget
        INFOPLIST_FILE: Widgets/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: kWiseWidget.entitlements
    dependencies:
      - package: kFoundation
        product: DetectionCore
      - package: kFoundation
        product: AppCatalogCore
      - package: kFoundation
        product: PowerScope
      - package: kFoundation
        product: CommonUtils
      - package: kFoundation
        product: FileScanner
      - package: kFoundation
        product: DesignSystem

  kWiseFinder:
    type: app-extension
    platform: macOS
    sources:
      - FinderExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris.finder
        PRODUCT_NAME: kWiseFinder
        INFOPLIST_FILE: FinderExtension/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: kWiseFinder.entitlements
    dependencies:
      - package: kFoundation
        product: DetectionCore
      - package: kFoundation
        product: AppCatalogCore
      - package: kFoundation
        product: PowerScope
      - package: kFoundation
        product: CommonUtils
      - package: kFoundation
        product: FileScanner
      - package: kFoundation
        product: DesignSystem

  kWiseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: kWise
      - package: kFoundation

  kWiseUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.klaris.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: kWise

packages:
  kFoundation:
    path: ../kFoundation

schemes:
  kWise:
    build:
      targets:
        kWise: all
    run:
      config: Debug
      # P1 T7 — local purchase testing against the non-consumable buyout.
      storeKitConfiguration: Configuration/Klaris.storekit
    test:
      config: Debug
      targets:
        - kWiseTests   # UITests excluded from default test action until Phase 8
  # P3 UI 冒烟独立 scheme：不打进 kWise 全量基线（672 tests 语义不变），
  # 冒烟单跑 `xcodebuild test -scheme kWiseSmokeUI`。
  kWiseSmokeUI:
    build:
      targets:
        kWise: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/Klaris.storekit
    test:
      config: Debug
      targets:
        - kWiseUITests
  KlarisDirect:
    build:
      targets:
        KlarisDirect: all
    run:
      config: Debug
  kWiseWidget:
    build:
      targets:
        kWiseWidget: all
  kWiseFinder:
    build:
      targets:
        kWiseFinder: all
