disabled_rules:
  - trailing_whitespace
  - line_length
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_imports
  - toggle_bool
included:
  - Core
  - Data
  - Features
  - App
  - Store
  - Intents
  - MenuBar
  - Widgets
excluded:
  - build
  - kFresh.xcodeproj
  - kFresh.xcworkspace
  - Tests
identifier_name:
  min_length: 2
  max_length: 60
function_body_length:
  warning: 100
  error: 200
type_body_length:
  warning: 500
  error: 1000
