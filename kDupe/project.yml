name: kSift
options:
  bundleIdPrefix: app.kraftly
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_STRICT_CONCURRENCY: complete
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  SWIFT_VERSION: "5.9"

targets:
  kSift:
    type: application
    platform: macOS
    sources:
      - App
      - Detection
      - Intents
      - Models
      - Persistence
      - Repository
      - Store
      - UI
      - Vault
      - Resources
      - path: Info.plist
        type: file
        buildPhase: none
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.ksift
      PRODUCT_NAME: kSift
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      STOREKIT_CONFIGURATION_FILE: Store/StoreConfig.storekit
      ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: kFoundation
      - target: kSiftFinderSync
    preBuildScripts:
      - name: "SwiftLint"
        script: "if which swiftlint >/dev/null; then swiftlint; fi"
        basedOnDependencyAnalysis: false

  kSiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.ksift.tests
    dependencies:
      - target: kSift
      - package: kFoundation

  kSiftFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - FinderSync
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.ksift.finder-sync
      PRODUCT_NAME: kSiftFinderSync
      INFOPLIST_FILE: FinderSync/Info.plist
      CODE_SIGN_ENTITLEMENTS: FinderSync/kSiftFinderSync.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      # Dev-only: ad-hoc sign so the main app's embed step accepts the
      # extension. A real Apple Developer cert is required for TestFlight
      # and App Store distribution (flip CODE_SIGN_IDENTITY back to your
      # team and set DEVELOPMENT_TEAM accordingly).
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      APPLICATION_EXTENSION_API_ONLY: true
      SWIFT_OBJC_INTERFACE_HEADER_NAME: ""
      SWIFT_INSTALL_OBJC_HEADER: NO
    dependencies:
      - package: kFoundation

packages:
  kFoundation:
    path: /Users/mengjianjun/Documents/ai/aicoding/macapp/kFoundation
