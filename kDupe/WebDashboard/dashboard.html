<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kDupe Dashboard</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<header>
  <h1>kDupe Dashboard</h1>
  <span id="status-badge" class="status-idle">Idle</span>
</header>
<main>
  <section class="card" id="scan-card">
    <h2>Scan</h2>
    <button id="scan-btn" onclick="triggerScan()">Start Scan</button>
    <div id="scan-progress" class="hidden">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <p id="progress-text">Scanning...</p>
    </div>
  </section>
  <section class="card" id="results-card">
    <h2>Results</h2>
    <table id="results-table">
      <thead><tr><th>Category</th><th>Files</th><th>Size</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
    <p id="no-results">No results yet. Run a scan.</p>
  </section>
</main>
<script src="/dashboard.js"></script>
</body>
</html>
