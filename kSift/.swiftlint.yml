# SwiftLint Configuration for kSift
# https://github.com/realm/SwiftLint

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - convenience_type
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - let_var_whitespace
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - nimble_operator
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_interface_orientation
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_arrow_whitespace
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - switch_case_on_newline
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - xct_specific_matcher
  - yoda_condition

disabled_rules:
  - block_based_kvo
  - class_delegate_protocol
  - compiler_prop_setters
  - cyclomatic_complexity
  - discarded_notification_center_observer
  - for_where
  - force_cast
  - force_try
  - function_body_length
  - function_parameter_count
  - generic_type_name
  - identifier_name
  - large_tuple
  - line_length
  - nesting
  - no_fallthrough_only
  - notification_center_detachment
  - opening_brace
  - redundant_discardable_let
  - redundant_optional_initialization
  - redundant_void_return
  - shorthand_operator
  - statement_position
  - superfluous_disable_command
  - todo
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - type_body_length
  - type_name
  - unneeded_break_in_switch
  - valid_ib_inspectable
  - void_return
  - weak_delegate
  - xctfail_message

analyzer_rules:
  - unused_import
  - unused_declaration

included:
  - App
  - CLI
  - Detection
  - FinderSync
  - Intents
  - MenuBar
  - Models
  - Persistence
  - Repository
  - Store
  - UI
  - WebDashboard
  - Widgets

excluded:
  - Tests
  - .build
  - DerivedData

# Configurable rules

file_header:
  required_pattern: |
    \/\/

number_separator:
  minimum_length: 5

trailing_closure:
  only_single_muted_parameter: true

vertical_whitespace:
  max_empty_lines: 2

force_unwrapping:
  severity: error

reporter: "xcode"
