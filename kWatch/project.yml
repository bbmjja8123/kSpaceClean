name: kWatch
options:
  bundleIdPrefix: app.kraftly
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_STRICT_CONCURRENCY: complete
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  SWIFT_VERSION: "5.9"

targets:
  kWatch:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "**/*.md"
          - "Tests/**"
          - "UITests/**"
          - "kWatchWidget/**"
          - "kWatchWidgetTests/**"
          - "kWatchControlWidget/**"
          - "Intents/Info.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.kwatch
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      LSUIElement: true
    dependencies:
      - package: kFoundation
        product: MetricsKit
      - package: kFoundation
        product: MonitorCore
      - package: kFoundation
        product: DesignSystem
      - target: kWatchIntents
    preBuildScripts:
      - name: "SwiftLint"
        script: "if which swiftlint >/dev/null; then swiftlint; fi"
        basedOnDependencyAnalysis: false

  kWatchWidget:
    type: app-extension
    platform: macOS
    sources:
      - kWatchWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.kwatch.widget
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: kFoundation
        product: MetricsKit
      - package: kFoundation
        product: MonitorCore
      - package: kFoundation
        product: DesignSystem

  kWatchIntents:
    type: app-extension
    platform: macOS
    sources:
      - path: Intents
        excludes:
          - "Info.plist"
    settings:
      INFOPLIST_FILE: Intents/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.kwatch.intents
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: kFoundation
        product: MetricsKit
      - package: kFoundation
        product: MonitorCore
      - package: kFoundation
        product: DesignSystem

  kWatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.kwatch.tests
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SWIFT_VERSION: "5.9"
    dependencies:
      - target: kWatch
      - target: kWatchIntents
      - package: kFoundation
        product: MetricsKit
      - package: kFoundation
        product: MonitorCore
      - package: kFoundation
        product: DesignSystem

  kWatchUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kraftly.kwatch.uitests
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SWIFT_VERSION: "5.9"
    dependencies:
      - target: kWatch

packages:
  kFoundation:
    path: ../kFoundation